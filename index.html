<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <title>RAGBLADE ARENA ⚔️ — 3D Ragdoll Sword Battle</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- ============ 3D CANVAS ============ -->
    <canvas id="game-canvas"></canvas>

    <!-- ============ LOADING SCREEN ============ -->
    <div id="loading" class="overlay">
      <div class="loading-inner">
        <div class="logo-blade">⚔️</div>
        <h1 class="logo-text">RAGBLADE<span>ARENA</span></h1>
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
        <p class="loading-msg" id="loading-msg">物理エンジンを初期化中...</p>
      </div>
    </div>

    <!-- ============ MAIN MENU ============ -->
    <div id="menu" class="overlay hidden">
      <div class="menu-inner">
        <div class="logo-blade big">⚔️</div>
        <h1 class="logo-text big">RAGBLADE<span>ARENA</span></h1>
        <p class="tagline">ラグドール物理 × 剣戟アクション × オンライン対戦</p>

        <div class="menu-buttons">
          <button class="btn btn-primary" data-mode="ai">
            <span class="btn-icon">🤖</span>
            <span class="btn-label">AI対戦</span>
            <span class="btn-sub">CPUと戦う</span>
          </button>
          <button class="btn btn-secondary" data-mode="online">
            <span class="btn-icon">🌐</span>
            <span class="btn-label">友達対戦</span>
            <span class="btn-sub">オンラインで対戦</span>
          </button>
          <button class="btn btn-ghost" data-mode="practice">
            <span class="btn-icon">🎯</span>
            <span class="btn-label">練習モード</span>
            <span class="btn-sub">操作を覚える</span>
          </button>
        </div>
        <p class="version">v2.0 · Three.js + Rapier Physics</p>
      </div>
    </div>

    <!-- ============ AI SETUP ============ -->
    <div id="ai-setup" class="overlay hidden">
      <div class="panel">
        <h2>🤖 AI対戦</h2>
        <div class="field">
          <label>難易度</label>
          <div class="seg" id="difficulty">
            <button data-val="easy">かんたん</button>
            <button data-val="normal" class="active">ふつう</button>
            <button data-val="hard">むずかしい</button>
            <button data-val="insane">鬼</button>
          </div>
        </div>
        <div class="field">
          <label>武器</label>
          <div class="seg" id="weapon-ai">
            <button data-val="katana" class="active">刀</button>
            <button data-val="greatsword">大剣</button>
            <button data-val="spear">槍</button>
            <button data-val="hammer">ハンマー</button>
          </div>
        </div>
        <div class="field">
          <label>ステージ</label>
          <div class="seg" id="stage-ai">
            <button data-val="arena" class="active">闘技場</button>
            <button data-val="snow">雪山</button>
            <button data-val="factory">工場</button>
          </div>
        </div>
        <div class="panel-actions">
          <button class="btn btn-ghost" data-back>← 戻る</button>
          <button class="btn btn-primary" id="start-ai">戦闘開始 ⚔️</button>
        </div>
      </div>
    </div>

    <!-- ============ ONLINE SETUP ============ -->
    <div id="online-setup" class="overlay hidden">
      <div class="panel">
        <h2>🌐 友達対戦</h2>
        <div class="field">
          <label>名前</label>
          <input type="text" id="player-name" maxlength="12" placeholder="プレイヤー名" />
        </div>
        <div class="online-tabs">
          <button class="tab active" data-tab="create">部屋を作る</button>
          <button class="tab" data-tab="join">部屋に入る</button>
        </div>

        <div class="tab-content" data-content="create">
          <div class="field">
            <label>武器</label>
            <div class="seg" id="weapon-host">
              <button data-val="katana" class="active">刀</button>
              <button data-val="greatsword">大剣</button>
              <button data-val="spear">槍</button>
              <button data-val="hammer">ハンマー</button>
            </div>
          </div>
          <button class="btn btn-primary" id="create-room">部屋を作成</button>
          <div id="room-info" class="room-info hidden">
            <p>ルームコード</p>
            <div class="room-code" id="room-code">----</div>
            <button class="btn btn-ghost btn-sm" id="copy-link">🔗 招待リンクをコピー</button>
            <p class="waiting" id="waiting-msg">相手の参加を待っています...</p>
          </div>
        </div>

        <div class="tab-content hidden" data-content="join">
          <div class="field">
            <label>ルームコード</label>
            <input type="text" id="join-code" maxlength="6" placeholder="ABCD12" style="text-transform:uppercase" />
          </div>
          <div class="field">
            <label>武器</label>
            <div class="seg" id="weapon-guest">
              <button data-val="katana" class="active">刀</button>
              <button data-val="greatsword">大剣</button>
              <button data-val="spear">槍</button>
              <button data-val="hammer">ハンマー</button>
            </div>
          </div>
          <button class="btn btn-primary" id="join-room">参加する</button>
          <p class="conn-status" id="conn-status"></p>
        </div>

        <div class="panel-actions">
          <button class="btn btn-ghost" data-back>← 戻る</button>
        </div>
      </div>
    </div>

    <!-- ============ HUD ============ -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-fighter hud-p1">
          <span class="hud-name" id="hud-name1">YOU</span>
          <div class="health-bar"><div class="health-fill" id="health1"></div></div>
          <div class="limb-status" id="limbs1"></div>
        </div>
        <div class="hud-center">
          <div class="round-pips" id="round-pips"></div>
          <div class="timer" id="match-timer">∞</div>
        </div>
        <div class="hud-fighter hud-p2">
          <span class="hud-name" id="hud-name2">CPU</span>
          <div class="health-bar"><div class="health-fill" id="health2"></div></div>
          <div class="limb-status" id="limbs2"></div>
        </div>
      </div>
      <button id="pause-btn" title="一時停止">⏸</button>
      <div id="net-stat" class="net-stat hidden">ping: -- ms</div>
    </div>

    <!-- ============ MOBILE CONTROLS ============ -->
    <div id="touch-controls" class="hidden">
      <div id="joystick-move" class="joystick-zone"></div>
      <div class="action-buttons">
        <button class="abtn" id="btn-jump">⤴</button>
        <button class="abtn" id="btn-block">🛡</button>
      </div>
      <div id="joystick-sword" class="joystick-zone joystick-right"></div>
      <div class="sword-hint">剣を操作 →</div>
    </div>

    <!-- ============ ROUND BANNER ============ -->
    <div id="round-banner" class="round-banner hidden"></div>

    <!-- ============ RESULT SCREEN ============ -->
    <div id="result" class="overlay hidden">
      <div class="result-inner">
        <h1 id="result-title">VICTORY</h1>
        <p id="result-sub"></p>
        <div class="result-actions">
          <button class="btn btn-primary" id="rematch">もう一度</button>
          <button class="btn btn-ghost" id="to-menu">メニューへ</button>
        </div>
      </div>
    </div>

    <!-- ============ DESKTOP HINT ============ -->
    <div id="desktop-hint" class="desktop-hint hidden">
      <strong>操作:</strong> WASD/移動 · マウスで剣 · クリック振り · Space/ジャンプ · Shift/ガード
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
